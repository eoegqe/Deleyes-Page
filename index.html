<audio id="music" src="music.ogg" autoplay loop></audio>

<script>
const music = document.getElementById("music");
const statusText = document.getElementById("status");
const visualizer = document.getElementById("visualizer");

music.volume = 0.7;

music.play()
    .then(() => {
        statusText.textContent = "JAZ IS BLASTING!!!";
        visualizer.classList.add("playing");
    })
    .catch(() => {
        statusText.textContent =
            "CLICK ANYWHERE TO START THE MUSIC!!!";

        document.addEventListener("click", function startMusic() {
            music.play().then(() => {
                statusText.textContent = "MUSIC IS BLASTING!!!";
                visualizer.classList.add("playing");
            }).catch(console.error);
        }, { once: true });
    });

music.addEventListener("error", () => {
    statusText.textContent = "WHERE IS music.ogg?!";
});

music.addEventListener("pause", () => {
    visualizer.classList.remove("playing");
});

music.addEventListener("play", () => {
    visualizer.classList.add("playing");
});
</script>
